# Settings format version.
version: 1
# How many times a day a parcel's carrier page is read while the parcel has no arrival day.
reads_per_day: 2
# The most parcels whose carrier page is read in one run of the lookup.
max_parcels_per_run: 10
# The most characters of a carrier's page the assistant reads.
page_max_chars: 6000
# A page with less text than this (a page that only works with scripts) is not sent to the assistant.
page_min_chars: 40
# What the assistant's reading of a carrier's page is called on screen.
task_label: Read a delivery's arrival day from the carrier's page
