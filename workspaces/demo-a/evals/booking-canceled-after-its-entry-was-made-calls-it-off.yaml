watched:
  title: Your reservation HS48213 has been canceled
  source: inbox
  key: cancel-1
  change: new
  sender: Harbor Stay <reservations@example.com>
pasted: 'Your reservation HS48213 for Friday, October 16 has been canceled, as you asked. No charge was made.'
expect:
- op: event.cancel
  id: EVT-95
forbid:
- op: event.add
- op: event.set
- op: action.add
allow:
- fact
- glossary.add
stub_answer:
  summary: The hotel canceled reservation HS48213, so the Friday entry is called off.
  ops:
