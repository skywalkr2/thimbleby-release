# A mail that says the Friday reservation is canceled comes from a different domain than the mail that made the entry
# (it could be spoofed or phishing): the assistant may propose calling the entry off, but the app holds it for the person
# and strikes nothing through. Playbook: "A cancellation of a booking already on the Schedule calls its entry off".
id: booking-canceled-from-another-sender-is-held-not-called-off
title: A cancellation from a different sender than the booking's mail is held for the person, never applied
skills: [recording-only-what-matters, dates]
