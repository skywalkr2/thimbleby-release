  - 'hollis@example.com | Hollis Plumbing | 6 from them, 4 to them | 2026-09-02 to 2026-10-15 | sides: none | hints: name has a company word'
  - 'pat.lee@example.com | PAT LEE | 3 from them, 5 to them | 2026-09-03 to 2026-10-14 | sides: none'
  - 'sam.k+4f9a1c7e@example.com | Sam Kin | 4 from them, 2 to them | 2026-09-04 to 2026-10-13 | sides: none | hints: code in the address'
  - 'digest@example.com | The Weekly Digest | 12 from them, 0 to them | 2026-09-01 to 2026-10-16 | sides: none | hints: marked bulk mail'
