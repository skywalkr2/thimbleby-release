id: junk-term
# A mail subject line or a one-off code is a fact about that message, never a word the person would use: the proposal is
# refused and nothing is learned, so nothing reaches the next packet. The good counterpart, a term the person explained in
# a correction that is then active at once, is `acronym`.
title: A subject line and a one-off code are never learned as words
skills: [use-term]
