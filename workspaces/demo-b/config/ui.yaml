version: 1
# Wording overrides by key from the UI's wording sheet.
wording: {}
shortcuts: {next: j, previous: k, primary: a, send_back: s, copy: c, edit: e, move: m, undo: u, hand_in: n, help: "?", ask: /, next_pane: "]", previous_pane: "[", show_new: "N"}
narrow_below_px: 640   # below this width: the phone layout, with a bottom bar
toast_seconds: 7
toast_undo_seconds: 10   # how long a message with Undo stays; 0 keeps it until closed
title_words: 12   # how many words a row's title holds before it is cut at a word
request_timeout_seconds: 30   # how long a screen waits for the app to answer before it says so
long_request_timeout_seconds: 300   # the same, for the few actions that take a while on purpose
afternoon_from_hour: 13   # the hour of your day from which the opening brief is called the afternoon brief
links: [{name: Planning board, address: "https://planning-board.example.com/spring"}, {name: Shared schedule, address: "https://shared-schedule.example.com/team"}]   # links to your own pages, shown in the header
feedback_to: feedback@example.com   # where the feedback button writes
report_to: ""   # where Report a problem sends a report; empty: the address built into the app
handled_group: kind   # how Handled for you groups what it lists to start with: kind, reason, sender or account
handled_rows_shown: 25   # how many rows a group shows before Show more
handled_preview_lines: 3   # how many lines of a message a row on Handled for you shows before Show the message
since_rows_shown: 25   # how many rows a day on Since yesterday shows before Show more
twin_window_minutes: 10   # how close in time the same change from two accounts must be to show as one row in What changed (0 turns it off)
changes_recent_days: 90   # how many days back What changed lists finished work (work still open is always listed)
open_rows_shown: 15   # how many to-dos a group on the To-dos screen shows before Show more
done_days: 30   # how many days back the Done tab on the To-dos screen lists finished to-dos
feedback_problem_days: 3   # how far back Send feedback offers to add failed work
feedback_problem_max: 20   # the most failures it offers to add
today: {mail_hours: 24, mail_max: 50, agenda_days_ahead: 1, schedule_days: 2, stale_after_days: 21, fold_batches_after_days: 3, fold_sends_from: 3, top_priorities_lines: 4, top_priorities_ahead_days: 10, rail_rows: 4, heavy_day_from: 30, group_rows: 5}   # what Today's agenda and what came in cover
schedule: {week_starts_on: sunday, day_starts: "08:00", day_ends: "18:00", event_minutes: 30, month_entries: 2, timeline_range: two_weeks}   # the calendar page: its week, its hours and its months
followups: {action_due_within_days: 5, undated_after_days: 10, question_after_days: 3, second_nudge_items: 2, escalate_after_chases: 2, soon_days: 2}   # when a sent item is due a follow-up, and how soon counts as due soon
walkthrough: {first_promises: 3, suggested_people: 5, reading_names: 3, not_people_addresses: [info, support, sales, billing], not_people_domain_words: [reply, replies, bounce], not_people_names: [team, support, bank, store]}   # how many promises the first-result screen shows; how many people the people step suggests; how many unread mailboxes the first reading names; and the address, domain and name words that are never a person
series: {usually_with_share: 0.5, usually_with_min_meetings: 2, usually_with_max: 6}   # who a series is "usually with" on its page
brand: {color: "#8a3b5c", logo: null, logo_max_kb: 512}   # the accent color; a logo is a picture uploaded in Settings and kept in this config folder, at most this many KB
notifications: {enabled: false, browser: true, webhook: null, webhook_format: plain, webhook_app: null, apps_extra: [], quiet_hours: {start: "21:00", end: "07:00"}, retry_minutes: 10, mail_titles_level: none, message_one: "1 decision waiting for you", message_many: "{count} decisions waiting for you", test_message: "This is a test. You will get a note like this when something needs you."}   # notices that something needs you: off until turned on, to you only, a count and never what an item is about
theme: system   # system, light or dark; each person can change it on their own device
density: comfortable   # comfortable or compact
time_format: 24h   # how times of day are written: auto (the language's own), 12h or 24h
time_step: 30   # the minutes between the times a time box lists
short_wait_minutes: 5   # a wait shorter than this is said in words; a longer one names the time of day
