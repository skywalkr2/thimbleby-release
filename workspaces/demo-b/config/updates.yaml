version: 1
check: true   # once a day, look at the release feed for a newer version and offer it on Today
include_prereleases: true   # offer test releases (alpha and beta) as well as finished ones
check_every_hours: 24   # how many hours apart the look is made
feed_address: ""   # empty: the address built into the app
close_wait_seconds: 180   # seconds an update waits for the app to close
install_wait_seconds: 1800   # seconds the installer has to finish
answer_wait_seconds: 300   # seconds the new version has to open before the old one is put back
