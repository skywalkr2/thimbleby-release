version: 1
backend: sqlite
export:
  every_minutes: 30
  commit: true
backups:
  targets:
    - path: ~/CloudDrive/lantern-backups
      label: cloud folder
  cloud_folders:    # the cloud drives the setup guide offers, found by where each keeps its folder
    - name: Example Drive
      macos: ["ExampleDrive"]
      windows: ["ExampleDrive"]
      linux: ["ExampleDrive"]
      personal: ["Personal"]   # an account named like this is the person's own; any other account in a folder name is a work one
  cloud_path: [Backups, Thimbleby]
  former_cloud_path: [Backups, PM Cockpit]
  every_hours: 12
  keep: 30
  local_keep: 30   # how many copies this computer keeps for itself: one a day from the first day, and one before every update
  local_folder: ""   # empty: a folder beside the workspace's own; it can't be inside the workspace
  warn_after_hours: 48   # how old the newest copy may be before the header and Today say it is overdue
  nudge_again_days: 14   # how long after Not now the reminder to pick a folder off this computer comes back
  shrink_percent: 40   # a copy smaller than this percent of the one before it in the same place is flagged
  automatic: true
  retry_minutes: 30
  before_changes: false   # a backup first before a change that is hard to take back (restoring, installing an add-on, releasing all, loading files, removing many records); true by default, off here because this sandbox's backup folder is made up
  bulk_change_records: 30   # a removal touching this many records counts as many
  key_min_chars: 12   # the fewest characters a backup key typed on a screen may have
  key_max_chars: 256   # the most characters a backup key typed on a screen may have
  encrypt: ""   # e.g. file:~/keys/backup.key; empty: backups are not encrypted
files:
  max_file_mb: 50
  max_total_mb: 2000
  read_max_mb: 25
  open_extensions: [pdf, png, jpg, jpeg, gif, webp, txt, csv, rtf, md, doc, docx, xls, xlsx, ppt, pptx, odt, ods, odp, mp3, m4a, mp4, mov]   # endings the app opens with the computer's program; any other is only shown in its folder
  open_types: [application/pdf, image/png, image/jpeg, image/gif, image/webp, text/plain, text/csv, text/markdown, text/rtf, application/rtf, application/msword, application/vnd.ms-excel, application/vnd.ms-powerpoint, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.openxmlformats-officedocument.presentationml.presentation, application/vnd.oasis.opendocument.text, application/vnd.oasis.opendocument.spreadsheet, application/vnd.oasis.opendocument.presentation, audio/mpeg, audio/mp4, video/mp4, video/quicktime]   # media types it opens; both must match
  read_max_chars: 30000
sync:
  folder: ""   # e.g. ~/CloudDrive/cockpit; off until set
  watch_outside_edits: true
  shared: false
  lease_stale_after_minutes: 10
kept_secrets:
  keep_days: 30
  undo_grace_minutes: 10
