# Words the engine writes into the person's own records itself, by wording-sheet key. The screens' wording sheet carries
# the same keys; the workspace's `ui.wording` overrides either.

# The name of the project that holds the person's own life, made when a workspace is set up.
project.personal_name: Personal

# The title of a calendar entry made from a booking confirmation: the kind of booking, then where (a route for a trip).
booking.title: "{kind}: {detail}"
booking.route: "{place} to {destination}"
booking.kind.flight: Flight
booking.kind.lodging: Stay
booking.kind.event: Event
booking.kind.restaurant: Table
booking.kind.rental_car: Rental car
booking.kind.train: Train

# What the change that moves unsure items says, and the standing rule proposed after the same sender's items are moved a
# second time: {side} is the side's name, {sender} the address the mail came from.
filing.move_summary: "Moved to {side} on screen"
filing.rule_text: "Mail from {sender} goes to {side}."
filing.rule_source: "You moved this sender's items to the same place twice."

# The title of a note made from a mail: its subject, then who sent it; with no subject, the first words of the body.
note.title_from: "{subject} · from {sender}"
note.title_from_unknown: "{subject}"

# How a message opens to someone who is only on the person's own life, by how they relate to the person: for each kind,
# the words in the person's description of them that mean it (separated by commas) and the opening line, {first_name}
# being the name a greeting to them uses. Anyone else on the own life gets `greeting.personal`; a colleague's message
# opens as the greeting setting says.
greeting.personal: "Hi {first_name}, hope you're doing well."
greeting.relation_words.partner: partner, wife, husband, spouse
greeting.relation.partner: "Hi {first_name},"
greeting.relation_words.parent: parent, mother, father, mom, dad, mum
greeting.relation.parent: "Hi {first_name},"
greeting.relation_words.child: child, son, daughter
greeting.relation.child: "Hi {first_name},"
greeting.relation_words.sister: sister, sis
greeting.relation.sister: "Hi {first_name}, hope you're well."
greeting.relation_words.brother: brother, bro
greeting.relation.brother: "Hi {first_name}, hope you're well."
greeting.relation_words.friend: friend
greeting.relation.friend: "Hey {first_name}, hope you're doing well."
greeting.relation_words.neighbor: neighbor, neighbour
greeting.relation.neighbor: "Hi {first_name}, hope you're well."
greeting.relation_words.landlord: landlord, landlady
greeting.relation.landlord: "Hello {first_name},"
greeting.relation_words.school: school, teacher
greeting.relation.school: "Hello {first_name},"
greeting.relation_words.tradesperson: tradesperson, plumber, electrician, builder
greeting.relation.tradesperson: "Hello {first_name},"
greeting.relation_words.doctor: doctor, dentist, nurse
greeting.relation.doctor: "Hello {first_name},"

# Where a word the assistant asks the meaning of came up, in the question's text: {line} is the line it was found on.
terms.came_up_in.notes: "It came up in your notes: {line}"
terms.came_up_in.mail: "It came up in mail from {sender}: {line}"
terms.came_up_in.mail_unknown: "It came up in a mail: {line}"
terms.came_up_in.calendar: "It came up in your calendar: {line}"
terms.came_up_in.file: "It came up in a file you handed in: {line}"
terms.came_up_in.source: "It came up in {source}: {line}"

# What a source of a service with several accounts is called: the name the add-on gave it, then the account it reads.
source.label_with_account: "{label}, {account}"

# What a to-do waits for while the calendar entry it is tied to is called off: {title} is the entry's title.
entry.called_off.waiting: "until {title} has a new date"

# The report to the maintainers drafted from a slow screen's Today line: the screens' names, then the title and text
# ({screen} a name below, {seconds} and {limit} in seconds, {held} how many records of each kind the workspace holds).
slow_screen.name.today: Today
slow_screen.name.todos: To-dos
slow_screen.name.people: People
slow_screen.name.changes: What changed
slow_screen.report_title: "{screen} is slow to open"
slow_screen.report_text: "The {screen} screen took {seconds} seconds to open, three times in a row; the limit set for a screen is {limit} seconds. The workspace holds {held}."

# "Not mine to track" on an item of a watched source (the person's own words for the drops; the line that says what it did).
not_mine.reason: "Not mine to track"
not_mine.summary: "Set aside what a source holds that is not mine to track"
not_mine.read_back: "Dropped this and {count} more from {source}. It is now only read to understand."

# The questions the engine asks by itself: a meeting that needs an agenda or has people away, and an entry for days away
# that could be for several people.
meeting_ask.title: "What should {title} on {day} take up?"
meeting_ask.no_agenda: "Nothing is on its agenda yet."
meeting_ask.away: "{why}."
meeting_ask.matters: "The agenda of {title} on {day}"
act.about.revision: "(revision {number})"
absence_ask.title: "Whose days away are these in {source}?"
absence_ask.text: "An entry for {days} could be for any of: {names}."

# What a held change says when the person changed the record while the assistant was working on it: {assistant} is the
# assistant's name.
run.changed_meanwhile: "You changed this while {assistant} was working on it."
run.changed_meanwhile.unnamed: "You changed this while your assistant was working on it."

# The tray or menu-bar item of the installed app: its hover title and its three lines.
desktop.title: Thimbleby
desktop.open: Open Thimbleby
desktop.update: Check for a new version
desktop.restart: Restart
desktop.quit: Quit
desktop.help: Help
desktop.login.mac: Open at login
desktop.login.windows: Start when I sign in
# The menu's top line, in the words of the app's header chip.
desktop.state.starting: Starting
desktop.state.live: All good
desktop.state.restart: Restart to finish
desktop.state.restarting: Restarting
desktop.state.failed: Restart failed

# The starting window of the installed app: its heading, its steps and the messages it turns into.
desktop.starting.title: Starting Thimbleby
desktop.starting.subtitle: Your window opens by itself in a moment.
desktop.starting.version: "Version {version}"
desktop.step.workspace: Your workspace is ready
desktop.step.app: The app is running
desktop.step.screens: Opening the screens
desktop.problem.disk_full.title: Your disk is full
desktop.problem.disk_full.text: Thimbleby needs about 50 MB free to start.
desktop.problem.elsewhere.title: Thimbleby is open on another computer
desktop.problem.elsewhere.text: Your workspace is in a synced folder, and the copy there is using it. Close it there, then try again.
desktop.problem.older_running.title: An older Thimbleby is still open
desktop.problem.older_running.text: A newer Thimbleby was opened, and the older one did not close when asked. Choose Quit on the older one's icon (in the menu bar on a Mac, in the tray by the clock on Windows), then choose Try again. Restarting the computer also closes it.
desktop.problem.held.title: Thimbleby couldn't start
desktop.problem.held.text: Something else on this computer stops Thimbleby from starting. Restarting the computer usually fixes it.
desktop.problem.other.title: Thimbleby couldn't start
desktop.problem.other.text: Try again. If it keeps happening, copy the details and send them to the people who look after Thimbleby.
desktop.try_again: Try again
desktop.earlier.title: Use the work you already have?
desktop.earlier.found: "Found on this computer, last used {used}."
desktop.earlier.facts: "{path} · Sides {sides} · To-dos {todos} · People {people}"
desktop.earlier.text: Using it brings it into this app. The original stays where it is as a copy.
desktop.earlier.use: Use it
desktop.earlier.fresh: Start fresh
desktop.copy_details: Copy details
# The window while the app updates itself, and the screen when the update didn't finish.
desktop.update.title: Updating Thimbleby
desktop.update.subtitle: Your work is copied first. Thimbleby opens again by itself.
desktop.update.step.copy: Copying your work
desktop.update.step.download: Downloading the update
desktop.update.step.check: Checking the file
desktop.update.step.install: Installing
desktop.update.step.open: Opening the new version
desktop.update.progress: "{done} of {total} MB"
desktop.update.failed.title: "Still on {version}"
desktop.update.failed.text: The update didn't finish, so nothing changed.
desktop.update.unrestored.title: Your work isn't back yet
desktop.update.unrestored.text: The update didn't finish, and the copy of your work made before it couldn't be put back. Thimbleby stays closed until it is, and nothing has been deleted. Try again, or quit, free up some room on this computer and open Thimbleby again.
desktop.update.menu: "Update to {version} and restart"
desktop.update.reason.not_installed: This copy of Thimbleby isn't the installed app, so it can't update itself. Download the new version instead.
desktop.update.reason.copy: Your work couldn't be copied first, so the update was stopped before it changed anything.
desktop.update.reason.offline: The update couldn't be downloaded because this computer isn't connected to the internet.
desktop.update.reason.download: The download stopped before it finished. Check the connection and try again.
desktop.update.reason.disk_full: There isn't enough room on this computer to update. Free up some space and try again.
desktop.update.reason.mismatch: The downloaded file isn't the one that was published, so it wasn't installed.
desktop.update.reason.unsafe: The update's files couldn't be kept where only you can reach them, so it was stopped before it changed anything.
desktop.update.reason.wrong_version: The version that opened wasn't the one you were offered, so the old one was put back with your work as it was.
desktop.update.reason.unreadable: The downloaded file couldn't be opened.
desktop.update.reason.folder: Thimbleby's folder can't be changed by this account, so the update couldn't be put in place.
desktop.update.reason.install: The new version couldn't be installed, so the old one was put back.
desktop.update.reason.close: Thimbleby didn't close in time, so the update was stopped before it changed anything.
desktop.update.reason.no_answer: The new version didn't open in time, so the old one was put back with your work as it was.
desktop.update.reason.other: Something stopped the update, and nothing changed.
desktop.copied: Copied

# The page the person's own browser shows after a sign-in started from the installed app's window.
sign_in.away.done: You're signed in
sign_in.away.not_done: The sign-in didn't finish
sign_in.away.back: You can close this tab and go back to Thimbleby, which shows what happened.
read.older_copy: The source served an older copy; nothing compared.
read.version_came_back: An older version came back, one seen before, so there is nothing new in it.
read.old_data.hint: The copy it reads was made before its normal refresh, so changes made since may be missing. Nothing in it is treated as news until it is refreshed.
read.failed.too_large: The mail service sent an answer too large to read here, so nothing was read this time. It is tried again on its schedule.
full_read.failed.too_large: The mail service sent a message too large to read here. Try again later, or choose a shorter reach.
full_read.failed.auth: The mail service asked you to sign in again. Sign in on this account, then try again.
full_read.failed.no_access: The mail service didn't let Thimbleby read older mail. Check the account's access, then try again.
full_read.failed.not_found: The mail service couldn't find the mail asked for. Try again.
full_read.failed.outage: The mail service didn't send the older mail just now. Try again in a few minutes.
full_read.failed.offline: You're offline, so older mail couldn't be read. Try again once you're connected.
full_read.failed.throttled: The mail service is busy. Try again in a few minutes.
